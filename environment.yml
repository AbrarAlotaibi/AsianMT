# Conda environment for the WMT26 Ar<->En MT pipeline.
#
# Create:
#   conda env create -f environment.yml
#   conda activate asianmt
#
# Update (after pulling changes to this file):
#   conda env update -f environment.yml --prune
#
# Tested with CUDA 12.1. If you have CUDA 11.8, change pytorch-cuda=12.1
# to pytorch-cuda=11.8.
name: asianmt
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch>=2.1
  - pytorch-cuda=12.1
  - pip:
      - -r requirements.txt
